name: ${APP_NAME:-dewordify}

services:
  app:
    build:
      context: .
      target: builder
      platforms:
        - linux/amd64
        - linux/arm64

    command: npm run dev -- --host --port 9000

    environment:
      - DEBUG=true
      - CI=false
      - NODE_ENV=development

    # https://docs.docker.com/compose/how-tos/file-watch/
    # develop:
    #   watch:
    #     - action: sync
    #       path: ./src
    #       target: /app
    #       ignore:
    #         - node_modules/
    #     - action: rebuild
    #       path: package.json

    volumes:
      - /app/node_modules
      - ./:/app

    ports:
      - "9000:9000"

  # Run the CLI against a .docx in this directory:
  #   docker compose run --rm cli file.docx
  # Builds dist/ via npm run build:cli, then forwards args to bin/dewordify.js.
  # The repo is mounted at /app, so outputs land back in this directory.
  cli:
    build:
      context: .
      target: builder
    profiles: ["cli"]

    volumes:
      - /app/node_modules
      - ./:/app

    entrypoint: ["sh", "-c", "npm run build:cli && node bin/dewordify.js \"$@\"", "--"]
