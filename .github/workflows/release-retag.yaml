name: release-images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to retag (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # Promote the already-published sha-<commit> image to the release tag and
  # cosign-sign it. This is triggered by a release or workflow_dispatch.
  retag:
    uses: bcit-tlu/.github/.github/workflows/release-retag.yaml@main
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      image_name: dewordify
      tag_name: ${{ inputs.tag_name || github.event.release.tag_name }}
    secrets: inherit
